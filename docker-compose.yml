# Minimal compose for development: PostgreSQL only.
# Phase 7 extends this file with the `api` service and the packaged web build.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: shazam
      POSTGRES_USER: shazam
      POSTGRES_PASSWORD: shazam
    ports: ["5432:5432"]
    # postgres:18+ expects a single mount at /var/lib/postgresql and places the
    # cluster in a version-specific subdirectory. Mounting .../data directly —
    # the pre-18 convention — makes the container exit on startup.
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shazam"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
